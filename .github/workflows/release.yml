name: Release

# Builds Corel.exe on Windows and attaches it to a GitHub release.
# Secrets:
#   COREL_CLIENT_SECRET (or the older ROICON_CLIENT_SECRET)  Roblox OAuth client secret
#   COREL_PUBLIC_SUPABASE_URL / COREL_PUBLIC_SUPABASE_ANON_KEY  workspace server (public values)
# Run it by pushing a tag like v2.0.0, or from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v2.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          COREL_CLIENT_SECRET: ${{ secrets.COREL_CLIENT_SECRET || secrets.ROICON_CLIENT_SECRET }}
          COREL_PUBLIC_SUPABASE_URL: ${{ secrets.COREL_PUBLIC_SUPABASE_URL }}
          COREL_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.COREL_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if (-not $env:COREL_CLIENT_SECRET) { Write-Warning "No Roblox OAuth secret: Sign in with Roblox will be disabled (API keys still work)." }
          if (-not $env:COREL_PUBLIC_SUPABASE_URL) { Write-Warning "No workspace server configured: users will be asked to enter one." }
          npx tauri build
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item src-tauri/target/release/corel.exe dist-release/Corel.exe

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG "dist-release/Corel.exe#Corel.exe (Windows)" --clobber
          } else {
            gh release create $env:TAG "dist-release/Corel.exe#Corel.exe (Windows)" --title "Corel $($env:TAG.TrimStart('v'))" --notes-file RELEASE_NOTES.md
          }
