name: Release

# Builds Roicon.exe on Windows with the OAuth client secret from the
# ROICON_CLIENT_SECRET repository secret, and attaches it to a GitHub release.
# Run it by pushing a tag like v1.1.0, or from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        env:
          ROICON_CLIENT_SECRET: ${{ secrets.ROICON_CLIENT_SECRET }}
        run: |
          if (-not $env:ROICON_CLIENT_SECRET) { throw "ROICON_CLIENT_SECRET secret is missing" }
          cargo build --release --locked
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/roicon.exe dist/Roicon.exe

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG "dist/Roicon.exe#Roicon.exe (Windows)" --clobber
          } else {
            gh release create $env:TAG "dist/Roicon.exe#Roicon.exe (Windows)" --title "Roicon $($env:TAG.TrimStart('v'))" --notes-file RELEASE_NOTES.md
          }
