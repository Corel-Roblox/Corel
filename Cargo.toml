[package]
name = "roicon"
version = "1.3.0"
edition = "2021"
description = "Countdown icons for Roblox. On autopilot."

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.32"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tiny-skia = "0.11"
ab_glyph = "0.2"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
tiny_http = "0.12"
rfd = "0.15"
notify-rust = "4"
keyring = { version = "3", features = ["windows-native"] }
winreg = "0.55"
tray-icon = "0.21"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }
rand = "0.9"
base64 = "0.22"
dirs = "6"
sha2 = "0.10"
mslnk = "0.1"

[build-dependencies]
winresource = "0.1"
rand = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
